<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>碳链工坊 · 3D分子工坊 | 有机合成策略</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧪</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #f5f7fb;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --accent: #2c7a4c;
            --accent-light: #4c9a6e;
            --accent-bg: #e6f3ec;
            --danger: #c23b22;
            --warning: #e67e22;
            --info: #3b82f6;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }
        body.dark {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --accent-bg: #1e3a2e;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 1rem;
            transition: background 0.2s;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent), #5a9ac0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .theme-btn {
            background: var(--accent-bg);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            color: var(--accent);
        }
        
        /* 音乐播放器样式 */
        .music-player {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .music-toggle-btn {
            background: var(--accent-bg);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: var(--accent);
            transition: all 0.3s ease;
        }
        
        .music-toggle-btn:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }
        
        .music-icon {
            animation: music-pulse 2s ease-in-out infinite;
        }
        
        @keyframes music-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .music-status {
            font-size: 0.7rem;
            opacity: 0.8;
        }
        
        .music-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            min-width: 280px;
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .music-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .music-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem;
        }
        
        .music-close-btn:hover {
            color: var(--accent);
        }
        
        .music-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .music-control-btn {
            background: var(--accent-bg);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--accent);
            transition: all 0.2s ease;
        }
        
        .music-control-btn:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-1px);
        }
        
        .music-volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: var(--bg-primary);
            border-radius: 8px;
        }
        
        .volume-slider {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }
        
        #volumeValue {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 35px;
        }
        
        .music-playlist {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .music-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.8rem;
        }
        
        .music-item:hover {
            background: var(--accent-bg);
        }
        
        .music-item.active {
            background: var(--accent);
            color: white;
        }
        
        .music-item-title {
            flex: 1;
        }
        
        .music-item-duration {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }
        
        .music-item.active .music-item-duration {
            color: rgba(255, 255, 255, 0.8);
        }
        .game-layout {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .molecule-card {
            flex: 1.2;
            min-width: 320px;
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .model-container {
            width: 100%;
            height: 320px;
            background: var(--accent-bg);
            border-radius: 1rem;
            margin: 0.5rem 0;
            overflow: hidden;
            position: relative;
        }
        .carbon-count {
            font-size: 1.2rem;
            text-align: center;
            margin: 0.5rem 0;
            font-weight: bold;
        }
        .reactant-panel {
            flex: 2;
            min-width: 400px;
        }
        .resources-panel {
            flex: 1;
            min-width: 260px;
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.2rem;
        }
        .reaction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .reaction-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .reaction-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }
        .reaction-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.3);
        }
        .reaction-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent);
        }
        .reaction-desc {
            font-size: 0.75rem;
            margin: 0.3rem 0;
            color: var(--text-secondary);
        }
        .reaction-stats {
            font-size: 0.7rem;
            display: flex;
            gap: 0.8rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }
        .stat-badge {
            background: var(--accent-bg);
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
        }
        .resource-item {
            display: flex;
            justify-content: space-between;
            margin: 0.8rem 0;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
        }
        .turn-counter {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            padding: 0.5rem;
            background: var(--accent-bg);
            border-radius: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .feedback {
            margin-top: 1rem;
            padding: 0.5rem;
            background: var(--accent-bg);
            border-radius: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }
        .victory { background: #2c7a4c; color: white; }
        .defeat { background: #c23b22; color: white; }
        .reset-btn, .buy-tech-btn {
            background: var(--warning);
            margin-top: 0.5rem;
            width: 100%;
        }
        .tech-btn {
            background: var(--info);
            margin-bottom: 0.5rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        @media (max-width: 800px) {
            .game-layout { flex-direction: column; }
            .model-container { height: 260px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🧪 碳链工坊 · 3D分子工坊 | 有机合成策略</h1>
        <div class="header-controls">
            <!-- 音乐播放器 -->
            <div class="music-player">
                <button class="music-toggle-btn" id="musicToggleBtn" title="音乐播放控制">
                    <span class="music-icon">🎵</span>
                    <span class="music-status" id="musicStatus">暂停</span>
                </button>
                <div class="music-dropdown" id="musicDropdown">
                    <div class="music-header">
                        <span>🎵 背景音乐</span>
                        <button class="music-close-btn" id="musicCloseBtn">✕</button>
                    </div>
                    <div class="music-controls">
                        <button class="music-control-btn" id="musicPlayPauseBtn">▶️ 播放</button>
                        <button class="music-control-btn" id="musicStopBtn">⏹️ 停止</button>
                        <button class="music-control-btn" id="musicNextBtn">⏭️ 下一首</button>
                    </div>
                    <div class="music-volume-control">
                        <span>🔊 音量</span>
                        <input type="range" id="musicVolume" min="0" max="100" value="50" class="volume-slider">
                        <span id="volumeValue">50%</span>
                    </div>
                    <div class="music-playlist" id="musicPlaylist">
                        <!-- 音乐列表将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
            <button class="theme-btn" id="darkModeToggle">🌙 深色模式</button>
        </div>
    </header>
    <div class="game-layout">
        <div class="molecule-card">
            <h3>🧬 当前分子 (3D 球棍模型)</h3>
            <div id="modelContainer" class="model-container"></div>
            <div class="carbon-count">📊 碳链长度: <span id="carbonCount">1</span> C</div>
            <div id="moleculeDetail" style="font-size:0.8rem; text-align:center;">官能团: 烷烃</div>
        </div>
        <div class="reactant-panel">
            <h3>⚗️ 可用的反应</h3>
            <div class="reaction-grid" id="reactionGrid"></div>
            <div class="feedback" id="feedbackMsg">选择反应，合理分配资源，在有限回合内达到目标碳数！</div>
        </div>
        <div class="resources-panel">
            <h3>📦 实验室资源</h3>
            <div class="resource-item"><span>⏱️ 剩余回合</span><span id="turnsLeft">15</span></div>
            <div class="resource-item"><span>🧪 碳预算 (C)</span><span id="carbonBudget">30</span></div>
            
            <h4 style="margin-top: 1rem; margin-bottom: 0.5rem;">⚗️ 试剂库存</h4>
            <div class="resource-item"><span>⚡ 镁</span><span id="magnesium">3</span></div>
            <div class="resource-item"><span>🧪 NaBH₄</span><span id="nabh4">2</span></div>
            <div class="resource-item"><span>🧪 PCC</span><span id="pcc">2</span></div>
            <div class="resource-item"><span>⚡ NaH</span><span id="nah">2</span></div>
            
            <h4 style="margin-top: 1rem; margin-bottom: 0.5rem;">🔬 催化剂</h4>
            <div class="resource-item"><span>当前</span><span id="currentCatalyst">无催化剂</span></div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchCatalyst('none')">无</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchCatalyst('cuI')">CuI (8点)</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchCatalyst('pdCl2')">PdCl₂ (12点)</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchCatalyst('niCl2')">NiCl₂ (10点)</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchCatalyst('raneyNi')">雷尼Ni (15点)</button>
            </div>
            
            <h4 style="margin-top: 1rem; margin-bottom: 0.5rem;">🧪 溶剂</h4>
            <div class="resource-item"><span>当前</span><span id="currentSolvent">无溶剂</span></div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchSolvent('none')">无</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchSolvent('ether')">无水乙醚</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchSolvent('thf')">THF</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchSolvent('dmf')">DMF</button>
                <button class="tech-btn" style="font-size: 0.7rem;" onclick="switchSolvent('water')">水</button>
            </div>
            
            <div class="resource-item"><span>🔬 研究点数</span><span id="researchPoints">0</span></div>
            <div class="turn-counter">🎯 目标分子: <span id="targetCarbon">10</span> C</div>
            <button id="techTreeBtn" class="tech-btn">📚 科技树升级</button>
            <button id="resetGameBtn" class="reset-btn">🔄 重新开局</button>
        </div>
    </div>
    <footer>⚛️ 原子经济 · 策略合成 | 副反应、产率波动、随机事件 | 3D 球棍模型展示真实烷烃构型</footer>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---------- 分子结构描述系统 ----------
    class MoleculeState {
        constructor(carbonCount = 1, functionalGroups = [], unsaturation = [], rings = [], chirality = null, stereochemistry = 'R') {
            this.carbonCount = carbonCount;
            this.functionalGroups = functionalGroups; // ['-OH', '=O', '-COOH', etc.]
            this.unsaturation = unsaturation; // ['C1=C2', 'C2=C3', etc.]
            this.rings = rings; // ['6-membered', '5-membered', etc.]
            this.chirality = chirality; // chiral center positions
            this.stereochemistry = stereochemistry; // 'R' or 'S'
        }
        
        // 获取分子描述
        getDescription() {
            let desc = `C${this.carbonCount}`;
            if (this.functionalGroups.length > 0) {
                desc += ` [${this.functionalGroups.join(', ')}]`;
            }
            if (this.unsaturation.length > 0) {
                desc += ` (${this.unsaturation.length}个不饱和键)`;
            }
            if (this.rings.length > 0) {
                desc += ` (${this.rings.join(', ')})`;
            }
            return desc;
        }
        
        // 检查是否含有特定官能团
        hasFunctionalGroup(group) {
            return this.functionalGroups.includes(group);
        }
        
        // 检查是否含有羰基
        hasCarbonyl() {
            return this.functionalGroups.includes('=O') || 
                   this.functionalGroups.includes('-CHO') ||
                   this.functionalGroups.includes('-COOH');
        }
        
        // 检查是否含有羟基
        hasHydroxyl() {
            return this.functionalGroups.includes('-OH');
        }
        
        // 检查是否含有α-氢（醛酮的α位氢）
        hasAlphaHydrogen() {
            return this.hasCarbonyl() && this.carbonCount >= 2;
        }
        
        // 检查是否含有共轭二烯
        hasConjugatedDiene() {
            return this.unsaturation.length >= 2 && this.carbonCount >= 4;
        }
        
        // 添加官能团
        addFunctionalGroup(group) {
            if (!this.functionalGroups.includes(group)) {
                this.functionalGroups.push(group);
            }
        }
        
        // 移除官能团
        removeFunctionalGroup(group) {
            const index = this.functionalGroups.indexOf(group);
            if (index > -1) {
                this.functionalGroups.splice(index, 1);
            }
        }
        
        // 添加不饱和键
        addUnsaturation(bond) {
            if (!this.unsaturation.includes(bond)) {
                this.unsaturation.push(bond);
            }
        }
        
        // 克隆分子状态
        clone() {
            return new MoleculeState(
                this.carbonCount,
                [...this.functionalGroups],
                [...this.unsaturation],
                [...this.rings],
                this.chirality,
                this.stereochemistry
            );
        }
    }
    
    // ---------- 目标分子库 ----------
    const TARGET_MOLECULES = [
        {
            name: "正丁醇",
            carbonCount: 4,
            functionalGroups: ['-OH'],
            unsaturation: [],
            rings: [],
            constraints: { allowAnyReaction: true },
            description: "直链醇，无特殊限制"
        },
        {
            name: "2-甲基-2-丁烯",
            carbonCount: 5,
            functionalGroups: [],
            unsaturation: ['C1=C2'],
            rings: [],
            constraints: { forbidGrignard: true },
            description: "含双键，不允许使用格式反应"
        },
        {
            name: "环己醇",
            carbonCount: 6,
            functionalGroups: ['-OH'],
            unsaturation: [],
            rings: ['6-membered'],
            constraints: { requireDielsAlder: true },
            description: "环状结构，必须使用Diels-Alder反应"
        },
        {
            name: "频哪醇",
            carbonCount: 6,
            functionalGroups: ['-OH', '-OH'],
            unsaturation: [],
            rings: [],
            constraints: { forbidExternalOxidant: true },
            description: "邻位二醇，不允许使用外部氧化剂"
        },
        {
            name: "4-甲基-2-戊醇",
            carbonCount: 6,
            functionalGroups: ['-OH'],
            unsaturation: [],
            rings: [],
            constraints: { requireComplexSynthesis: true },
            description: "支链醇，需要多步合成"
        },
        {
            name: "苯甲醛",
            carbonCount: 7,
            functionalGroups: ['-CHO'],
            unsaturation: [],
            rings: ['6-membered-aromatic'],
            constraints: { requireAromatic: true },
            description: "芳香醛，需要芳香环"
        },
        {
            name: "乙酸乙酯",
            carbonCount: 4,
            functionalGroups: ['-COO-'],
            unsaturation: [],
            rings: [],
            constraints: { requireEsterification: true },
            description: "酯类化合物"
        },
        {
            name: "3-己烯-2-醇",
            carbonCount: 6,
            functionalGroups: ['-OH'],
            unsaturation: ['C2=C3'],
            rings: [],
            constraints: { requireUnsaturationAndAlcohol: true },
            description: "同时含双键和羟基"
        }
    ];
    
    // ---------- 科学反应系统 ----------
    const REACTIONS = [
        {
            id: "grignard", 
            name: "格式反应 (Grignard)", 
            desc: "含羰基分子 + 卤代烃 → 二级醇 (+2C)",
            precursorCheck: (molecule) => molecule.hasCarbonyl(),
            costTurn: 1, 
            costMg: 1, 
            costCu: 0, 
            costPd: 0, 
            minCarbon: 1, 
            yieldBase: 0.9, 
            sideEffectChance: 0.05, 
            sideEffectDesc: "格式试剂遇水分解，未与底物反应",
            requires: { mg: 1 }, 
            tooltip: "需要羰基，消耗1镁，+2C，产率90%",
            transform: (molecule) => {
                const newMol = molecule.clone();
                newMol.carbonCount += 2;
                newMol.removeFunctionalGroup('=O');
                newMol.addFunctionalGroup('-OH');
                return newMol;
            },
            equation: "R-CO-R' + R''-MgBr → R-C(OH)(R'')-R'"
        },
        {
            id: "aldol", 
            name: "羟醛缩合 (Aldol)", 
            desc: "含α-氢的醛/酮 → β-羟基醛/酮 (碳链翻倍)",
            precursorCheck: (molecule) => molecule.hasAlphaHydrogen(),
            costTurn: 2, 
            costMg: 0, 
            costCu: 0, 
            costPd: 0, 
            minCarbon: 2, 
            yieldBase: 0.85, 
            sideEffectChance: 0.1,

        // 检查官能团
        if (currentMolecule.functionalGroups.length !== targetMolecule.functionalGroups.length) return false;
        for (let group of targetMolecule.functionalGroups) {
            if (!currentMolecule.hasFunctionalGroup(group)) return false;
        }
        
        // 检查不饱和键
        if (currentMolecule.unsaturation.length !== targetMolecule.unsaturation.length) return false;
        
        // 检查环结构
        if (currentMolecule.rings.length !== targetMolecule.rings.length) return false;
        for (let ring of targetMolecule.rings) {
            if (!currentMolecule.rings.includes(ring)) return false;
        }
        
        return true;

        if (!targetMolecule || !targetMolecule.constraints) return true;

        if (constraints.requireDielsAlder && reaction.id !== "diels_alder") {

    function calculateEffectiveYield(reaction) {
        let baseYield = reaction.yieldBase;

            const catalyst = CATALYSTS[currentCatalyst];
            baseYield += catalyst.effect;

        // 溶剂效果
        const solvent = SOLVENTS[currentSolvent];
        if (solvent.effects[reaction.id]) {
            baseYield += solvent.effects[reaction.id].yield || 0;
        }
        
        return Math.max(0, Math.min(1, baseYield));
    }

    // 计算碳原子位置：正确实现sp3正四面体和sp2平面三角形构型
    function calculateCarbonPositions(n, moleculeState = null) {
        const positions = [];
        const bondLength = 1.5;
        const sp3Angle = Math.PI * 109.5 / 180; // sp3键角 109.5°
        const sp2Angle = Math.PI * 120 / 180;    // sp2键角 120°
        
        for (let i = 0; i < n; i++) {
            let x, y, z;
            
            // 检查当前碳原子的杂化类型
            let hybridization = 'sp3'; // 默认sp3
            if (moleculeState) {
                // 检查是否有双键或羰基（sp2杂化）
                if (moleculeState.unsaturation.some(unsat => unsat.includes(`C${i+1}=`)) ||
                    moleculeState.functionalGroups.includes('=O') ||
                    moleculeState.functionalGroups.includes('-CHO')) {
                    hybridization = 'sp2';
                }
            }
            
            if (i === 0) {
                // 第一个碳原子在原点
                x = 0; y = 0; z = 0;
            } else if (i === 1) {
                // 第二个碳原子沿x轴
                x = bondLength; y = 0; z = 0;
            } else {
                const prev = positions[i-1];
                const prevPrev = positions[i-2];
                const direction = new THREE.Vector3(prev.x - prevPrev.x, prev.y - prevPrev.y, prev.z - prevPrev.z);
                direction.normalize();
                
                // 根据杂化类型选择键角
                const bondAngle = hybridization === 'sp2' ? sp2Angle : sp3Angle;
                
                // 计算下一个位置
                if (i === 2) {
                    // 第三个原子，创建锯齿构型
                    const axis = new THREE.Vector3(0, 1, 0);
                    const rotation = new THREE.Quaternion().setFromAxisAngle(axis, bondAngle - Math.PI);
                    const rotated = direction.clone().applyQuaternion(rotation);
                    x = prev.x + rotated.x * bondLength;
                    y = prev.y + rotated.y * bondLength;
                    z = prev.z + rotated.z * bondLength;
                } else {
                    // 后续原子，交替上下
                    const upDown = (i % 2 === 0) ? 1 : -1;
                    const axis = new THREE.Vector3(0, upDown, 0);
                    const rotation = new THREE.Quaternion().setFromAxisAngle(axis, bondAngle - Math.PI);
                    const rotated = direction.clone().applyQuaternion(rotation);
                    x = prev.x + rotated.x * bondLength;
                    y = prev.y + rotated.y * bondLength;
                    z = prev.z + rotated.z * bondLength;
                }
            }
            positions.push({ x, y, z, hybridization });
        }
        return positions;
    }

    // 根据分子状态生成3D模型（增强版本）
    function generateCarbonChain(n, moleculeState = null, isTransition = false) {
        if (currentModelGroup) {
            scene.remove(currentModelGroup);
            // 清理材质等
            if (currentModelGroup.children) {
                currentModelGroup.children.forEach(child => {
                    if (child.isMesh) child.material.dispose();
                });
            }
        }
        const group = new THREE.Group();
        if (n === 0) return group;
        
        // 原子半径和键半径
        const atomRadius = 0.4;
        const bondRadius = 0.08;
        const carbonColor = isTransition ? 0x888888 : 0x6c8c5e;
        const hydrogenColor = 0xaaaaaa;
        const oxygenColor = 0xff4444;
        const nitrogenColor = 0x4444ff;
        
        // 计算碳原子位置: 正确的锯齿链，键角109.5°，键长1.54Å (缩放为1.5单位)
        const positions = calculateCarbonPositions(n, moleculeState);
        
        // 添加碳原子球体
        for (let i = 0; i < n; i++) {
            const pos = positions[i];
            const geometry = new THREE.SphereGeometry(atomRadius, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: carbonColor, 
                roughness: 0.3, 
                metalness: 0.1,
                emissive: isTransition ? 0x222222 : 0x000000,
                emissiveIntensity: isTransition ? 0.3 : 0
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(pos.x, pos.y, pos.z);
            group.add(sphere);
            
            // 添加CSS2D文字标签
            const div = document.createElement('div');
            div.textContent = 'C';
            div.style.color = '#fff';
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0 #000';
            div.style.background = isTransition ? 'rgba(255,165,0,0.5)' : 'rgba(0,0,0,0.5)';
            div.style.padding = '2px 4px';
            div.style.borderRadius = '12px';
            const label = new CSS2DObject(div);
            label.position.set(pos.x, pos.y + 0.5, pos.z);
            group.add(label);
        }
        
        // 智能官能团定位和可视化
        if (moleculeState && moleculeState.functionalGroups.length > 0) {
            // 为每个官能团智能分配碳原子位置
            const functionalGroupAssignments = assignFunctionalGroupsToCarbons(moleculeState.functionalGroups, positions);
            
            functionalGroupAssignments.forEach((assignment, index) => {
                const { carbonIndex, groupType } = assignment;
                const carbonPos = positions[carbonIndex];
                const carbonHybridization = carbonPos.hybridization || 'sp3';
                
                // 根据官能团类型和杂化状态计算位置
                let functionalGroupPositions = calculateFunctionalGroupPosition(groupType, carbonPos, carbonHybridization, carbonIndex, moleculeState);
                
                // 为每个位置添加原子
                functionalGroupPositions.forEach(posInfo => {
                    addFunctionalGroupAtom(groupType, posInfo.position, posInfo.symbol, posInfo.color, posInfo.size, carbonPos, bondRadius, isTransition, posInfo.bondType);
                });
            });
        }
        
        // 智能分配官能团到碳原子
        function assignFunctionalGroupsToCarbons(functionalGroups, positions) {
            const assignments = [];
            const carbonUsage = new Array(positions.length).fill(0); // 每个碳原子已使用的官能团数量
            
            functionalGroups.forEach((group, index) => {
                let bestCarbonIndex = 0;
                let minUsage = carbonUsage[0];
                
                // 找到使用最少的碳原子
                for (let i = 1; i < positions.length; i++) {
                    if (carbonUsage[i] < minUsage) {
                        minUsage = carbonUsage[i];
                        bestCarbonIndex = i;
                    }
                }
                
                // 特殊处理：羰基和醛基优先分配给链中心位置
                if (group === '=O' || group === '-CHO') {
                    bestCarbonIndex = Math.floor(positions.length / 2); // 链中心
                }
                
                assignments.push({
                    carbonIndex: bestCarbonIndex,
                    groupType: group
                });
                
                carbonUsage[bestCarbonIndex]++;
            });
            
            return assignments;
        }
        
        // 计算官能团位置的函数（改进版）
        function calculateFunctionalGroupPosition(groupType, carbonPos, hybridization, carbonIndex, moleculeState) {
            const positions = [];
            const bondLength = 1.2; // C-O键长
            
            // 计算可用的键方向
            const availableDirections = getAvailableBondDirections(carbonPos, carbonIndex, positions);
            
            if (groupType === '=O' || groupType === '-CHO') {
                // 羰基：强制sp2杂化，垂直于碳链平面
                const carbonylPos = {
                    x: carbonPos.x,
                    y: carbonPos.y + bondLength,
                    z: carbonPos.z
                };
                
                positions.push({
                    position: carbonylPos,
                    symbol: 'O',
                    color: oxygenColor,
                    size: atomRadius * 0.8,
                    bondType: 'double'
                });
                
                if (groupType === '-CHO') {
                    // 醛基的氢原子，在sp2平面内
                    const hydrogenPos = {
                        x: carbonPos.x - bondLength * 0.8,
                        y: carbonPos.y,
                        z: carbonPos.z
                    };
                    
                    positions.push({
                        position: hydrogenPos,
                        symbol: 'H',
                        color: hydrogenColor,
                        size: atomRadius * 0.6,
                        bondType: 'single'
                    });
                }
                
            } else if (groupType === '-OH') {
                // 羟基：使用可用的四面体方向
                const ohDirection = availableDirections[0] || { x: 1, y: 0.5, z: 0 };
                const normalized = normalizeVector(ohDirection);
                
                const ohPos = {
                    x: carbonPos.x + normalized.x * bondLength,
                    y: carbonPos.y + normalized.y * bondLength,
                    z: carbonPos.z + normalized.z * bondLength
                };
                
                positions.push({
                    position: ohPos,
                    symbol: 'O',
                    color: oxygenColor,
                    size: atomRadius * 0.8,
                    bondType: 'single'
                });
                
            } else if (groupType === '-COOH') {
                // 羧基：羰基+羟基
                // 羰基部分
                const carbonylPos = {
                    x: carbonPos.x,
                    y: carbonPos.y + bondLength,
                    z: carbonPos.z
                };
                
                positions.push({
                    position: carbonylPos,
                    symbol: 'O',
                    color: oxygenColor,
                    size: atomRadius * 0.8,
                    bondType: 'double'
                });
                
                // 羟基部分，在sp2平面内
                const ohDirection = availableDirections[0] || { x: 0.866, y: 0, z: 0.5 };
                const normalized = normalizeVector(ohDirection);
                
                const ohPos = {
                    x: carbonPos.x + normalized.x * bondLength,
                    y: carbonPos.y + normalized.y * bondLength,
                    z: carbonPos.z + normalized.z * bondLength
                };
                
                positions.push({
                    position: ohPos,
                    symbol: 'O',
                    color: oxygenColor,
                    size: atomRadius * 0.8,
                    bondType: 'single'
                });
                
            } else if (groupType === '-O-') {
                // 醚基：使用可用方向
                const etherDirection = availableDirections[0] || { x: 1, y: 0, z: 0 };
                const normalized = normalizeVector(etherDirection);
                
                const etherPos = {
                    x: carbonPos.x + normalized.x * bondLength,
                    y: carbonPos.y + normalized.y * bondLength,
                    z: carbonPos.z + normalized.z * bondLength
                };
                
                positions.push({
                    position: etherPos,
                    symbol: 'O',
                    color: oxygenColor,
                    size: atomRadius * 0.8,
                    bondType: 'single'
                });
            }
            
            return positions;
        }
        
        // 获取可用的键方向
        function getAvailableBondDirections(carbonPos, carbonIndex, allPositions) {
            const directions = [];
            
            // 计算已占用的方向（碳-碳键）
            const occupiedDirections = [];
            
            // 检查与前后碳原子的连接
            if (carbonIndex > 0) {
                const prevCarbon = allPositions[carbonIndex - 1];
                const dir = {
                    x: prevCarbon.x - carbonPos.x,
                    y: prevCarbon.y - carbonPos.y,
                    z: prevCarbon.z - carbonPos.z
                };
                occupiedDirections.push(normalizeVector(dir));
            }
            
            if (carbonIndex < allPositions.length - 1) {
                const nextCarbon = allPositions[carbonIndex + 1];
                const dir = {
                    x: nextCarbon.x - carbonPos.x,
                    y: nextCarbon.y - carbonPos.y,
                    z: nextCarbon.z - carbonPos.z
                };
                occupiedDirections.push(normalizeVector(dir));
            }
            
            // 生成四面体方向
            const tetraDirections = [
                { x: 1, y: 1, z: 1 },
                { x: -1, y: 1, z: -1 },
                { x: 1, y: -1, z: -1 },
                { x: -1, y: -1, z: 1 },
                { x: 1, y: 0, z: -1 },
                { x: -1, y: 0, z: 1 }
            ];
            
            // 过滤掉已占用的方向
            tetraDirections.forEach(dir => {
                const normalized = normalizeVector(dir);
                let isOccupied = false;
                
                occupiedDirections.forEach(occupied => {
                    if (Math.abs(normalized.x - occupied.x) < 0.3 &&
                        Math.abs(normalized.y - occupied.y) < 0.3 &&
                        Math.abs(normalized.z - occupied.z) < 0.3) {
                        isOccupied = true;
                    }
                });
                
                if (!isOccupied) {
                    directions.push(normalized);
                }
            });
            
            return directions.length > 0 ? directions : [{ x: 0, y: 1, z: 0 }];
        }
        
        // 向量归一化
        function normalizeVector(vector) {
            const length = Math.sqrt(vector.x * vector.x + vector.y * vector.y + vector.z * vector.z);
            if (length === 0) return { x: 0, y: 1, z: 0 };
            
            return {
                x: vector.x / length,
                y: vector.y / length,
                z: vector.z / length
            };
        }
        
        // 添加氢原子到碳原子（修复版）
        function addHydrogenAtoms(positions, group, bondRadius, isTransition) {
            const hydrogenBondLength = 1.0;
            
            // 首先计算每个碳原子的官能团分配
            const carbonFunctionalGroups = new Array(positions.length).fill(0);
            if (moleculeState && moleculeState.functionalGroups.length > 0) {
                const assignments = assignFunctionalGroupsToCarbons(moleculeState.functionalGroups, positions);
                assignments.forEach(assignment => {
                    carbonFunctionalGroups[assignment.carbonIndex]++;
                });
            }
            
            positions.forEach((carbonPos, carbonIndex) => {
                const hybridization = carbonPos.hybridization || 'sp3';
                
                if (hybridization === 'sp3') {
                    // sp3杂化碳的氢原子，按四面体构型排列
                    let hydrogenCount = 4; // 饱和碳最多4个键
                    
                    // 减去已连接的官能团数量
                    hydrogenCount -= carbonFunctionalGroups[carbonIndex];
                    
                    // 减去碳-碳键数量
                    if (carbonIndex > 0) hydrogenCount -= 1; // 连接到前一个碳
                    if (carbonIndex < positions.length - 1) hydrogenCount -= 1; // 连接到后一个碳
                    
                    // 获取可用的键方向
                    const availableDirections = getAvailableBondDirections(carbonPos, carbonIndex, positions);
                    
                    // 添加剩余的氢原子
                    for (let h = 0; h < Math.max(0, hydrogenCount); h++) {
                        let direction;
                        if (h < availableDirections.length) {
                            direction = availableDirections[h];
                        } else {
                            // 如果可用方向不够，生成默认方向
                            const angle = (h * 72) * Math.PI / 180; // 72度间隔
                            direction = {
                                x: Math.cos(angle),
                                y: 0.5,
                                z: Math.sin(angle)
                            };
                        }
                        
                        const normalized = normalizeVector(direction);
                        const x = carbonPos.x + normalized.x * hydrogenBondLength;
                        const y = carbonPos.y + normalized.y * hydrogenBondLength;
                        const z = carbonPos.z + normalized.z * hydrogenBondLength;
                        
                        addFunctionalGroupAtom('H', { x, y, z }, 'H', hydrogenColor, atomRadius * 0.5, carbonPos, bondRadius, isTransition, 'single');
                    }
                } else if (hybridization === 'sp2') {
                    // sp2杂化碳的氢原子，按平面三角形排列
                    let hydrogenCount = 3; // sp2碳最多3个键
                    
                    // 减去已连接的官能团数量
                    hydrogenCount -= carbonFunctionalGroups[carbonIndex];
                    
                    // 减去碳-碳键数量
                    if (carbonIndex > 0) hydrogenCount -= 1;
                    if (carbonIndex < positions.length - 1) hydrogenCount -= 1;
                    
                    // 添加剩余的氢原子（在sp2平面内）
                    for (let h = 0; h < Math.max(0, hydrogenCount); h++) {
                        const angle = (h * 120 + carbonIndex * 60) * Math.PI / 180;
                        const x = carbonPos.x + hydrogenBondLength * Math.cos(angle);
                        const y = carbonPos.y;
                        const z = carbonPos.z + hydrogenBondLength * Math.sin(angle);
                        
                        addFunctionalGroupAtom('H', { x, y, z }, 'H', hydrogenColor, atomRadius * 0.5, carbonPos, bondRadius, isTransition, 'single');
                    }
                }
            });
        }
        
        // 添加氢原子
        addHydrogenAtoms(positions, group, bondRadius, isTransition);
        
        // 添加官能团原子的辅助函数
        function addFunctionalGroupAtom(group, position, symbol, color, size, carbonPos, bondRadius, isTransition, bondType = 'single') {
            // 创建官能团原子
            const atomGeometry = new THREE.SphereGeometry(size, 20, 20);
            const atomMaterial = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.15, 
                metalness: 0.05,
                emissive: isTransition ? color : 0x000000,
                emissiveIntensity: isTransition ? 0.6 : 0
            });
            const atomSphere = new THREE.Mesh(atomGeometry, atomMaterial);
            atomSphere.position.set(position.x, position.y, position.z);
            if (group && typeof group.add === 'function') {
                group.add(atomSphere);
            }
            
            // 添加发光效果
            if (isTransition) {
                const glowGeometry = new THREE.SphereGeometry(size * 1.3, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.3
                });
                const glowSphere = new THREE.Mesh(glowGeometry, glowMaterial);
                glowSphere.position.set(position.x, position.y, position.z);
                if (group && typeof group.add === 'function') {
                    group.add(glowSphere);
                }
            }
            
            // 添加原子标签
            const atomDiv = document.createElement('div');
            atomDiv.textContent = symbol;
            atomDiv.style.color = '#fff';
            atomDiv.style.fontSize = '12px';
            atomDiv.style.fontWeight = 'bold';
            atomDiv.style.textShadow = '1px 1px 0 #000';
            atomDiv.style.background = isTransition ? 
                `linear-gradient(135deg, ${color.toString(16)}88, ${color.toString(16)}cc)` : 
                `${color.toString(16).padStart(2, '0')}cc`;
            atomDiv.style.padding = '3px 6px';
            atomDiv.style.borderRadius = '10px';
            atomDiv.style.border = isTransition ? '2px solid rgba(255,255,255,0.8)' : 'none';
            const atomLabel = new CSS2DObject(atomDiv);
            atomLabel.position.set(position.x, position.y + size + 0.3, position.z);
            if (group && typeof group.add === 'function') {
                group.add(atomLabel);
            }
            
            // 添加化学键
            const bondStart = new THREE.Vector3(carbonPos.x, carbonPos.y, carbonPos.z);
            const bondEnd = new THREE.Vector3(position.x, position.y, position.z);
            const bondDirection = new THREE.Vector3().subVectors(bondEnd, bondStart);
            const bondLength = bondDirection.length();
            const bondCenter = bondStart.clone().add(bondEnd).multiplyScalar(0.5);
            
            // 根据键类型设置键的粗细
            let bondRadiusMultiplier = 1.0;
            if (bondType === 'double') bondRadiusMultiplier = 1.4;
            else if (bondType === 'triple') bondRadiusMultiplier = 1.8;
            
            const bondCylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    bondRadius * bondRadiusMultiplier, 
                    bondRadius * bondRadiusMultiplier, 
                    bondLength, 12
                ),
                new THREE.MeshStandardMaterial({ 
                    color: isTransition ? 0xffffff : 0xccccaa, 
                    roughness: 0.3,
                    metalness: 0.1,
                    emissive: isTransition ? 0x666666 : 0x000000,
                    emissiveIntensity: isTransition ? 0.3 : 0
                })
            );
            bondCylinder.position.copy(bondCenter);
            bondCylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), bondDirection.clone().normalize());
            if (group && typeof group.add === 'function') {
                group.add(bondCylinder);
            }
            
            // 双键添加第二个键
            if (bondType === 'double') {
                const offset = 0.15;
                const perpDir = new THREE.Vector3(-bondDirection.z, 0, bondDirection.x).normalize();
                const doubleBondStart = bondStart.clone().add(perpDir.multiplyScalar(offset));
                const doubleBondEnd = bondEnd.clone().add(perpDir.multiplyScalar(offset));
                const doubleBondCenter = doubleBondStart.clone().add(doubleBondEnd).multiplyScalar(0.5);
                
                const doubleBondCylinder = new THREE.Mesh(
                    new THREE.CylinderGeometry(bondRadius * 0.6, bondRadius * 0.6, bondLength, 8),
                    new THREE.MeshStandardMaterial({ 
                        color: isTransition ? 0xffffff : 0xccccaa, 
                        roughness: 0.3,
                        emissive: isTransition ? 0x666666 : 0x000000,
                        emissiveIntensity: isTransition ? 0.3 : 0
                    })
                );
                doubleBondCylinder.position.copy(doubleBondCenter);
                doubleBondCylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), bondDirection.clone().normalize());
                if (group && typeof group.add === 'function') {
                    group.add(doubleBondCylinder);
                }
            }
        }
        // 添加碳-碳键 (圆柱体)
        for (let i = 0; i < n-1; i++) {
            const p1 = positions[i];
            const p2 = positions[i+1];
            const start = new THREE.Vector3(p1.x, p1.y, p1.z);
            const end = new THREE.Vector3(p2.x, p2.y, p2.z);
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            const center = start.clone().add(end).multiplyScalar(0.5);
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(bondRadius, bondRadius, length, 8),
                new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.4 })
            );
            cylinder.position.copy(center);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
            group.add(cylinder);
        }
        // 添加氢原子 (正确的四面体几何构型)
        for (let i = 0; i < n; i++) {
            const pos = positions[i];
            const hGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const hMaterial = new THREE.MeshStandardMaterial({ color: hydrogenColor });
            
            // 计算氢原子的四面体位置
            let hPositions = [];
            
            if (i === 0 && n === 1) {
                // 甲烷：4个氢原子呈正四面体
                const hDistance = 0.7;
                const tetrahedralPositions = [
                    { x: hDistance, y: 0, z: 0 },
                    { x: -hDistance/3, y: hDistance * Math.sqrt(8)/3, z: 0 },
                    { x: -hDistance/3, y: -hDistance * Math.sqrt(2)/3, z: hDistance * Math.sqrt(6)/3 },
                    { x: -hDistance/3, y: -hDistance * Math.sqrt(2)/3, z: -hDistance * Math.sqrt(6)/3 }
                ];
                hPositions = tetrahedralPositions.map(p => ({
                    x: pos.x + p.x,
                    y: pos.y + p.y, 
                    z: pos.z + p.z
                }));
            } else {
                // 链状烷烃：每个碳的氢原子数
                const hCount = (i === 0 || i === n-1) ? 3 : 2;
                
                if (i === 0) {
                    // 第一个碳：3个氢原子
                    const nextPos = positions[1];
                    const bondDir = new THREE.Vector3(nextPos.x - pos.x, nextPos.y - pos.y, nextPos.z - pos.z).normalize();
                    
                    // 创建垂直于键方向的向量
                    let perpDir1 = new THREE.Vector3(-bondDir.y, bondDir.x, 0);
                    if (perpDir1.length() < 0.001) {
                        perpDir1 = new THREE.Vector3(0, -bondDir.z, bondDir.y);
                    }
                    perpDir1.normalize();
                    
                    const perpDir2 = new THREE.Vector3().crossVectors(bondDir, perpDir1).normalize();
                    
                    hPositions = [
                        { x: pos.x - bondDir.x * 0.7 + perpDir1.x * 0.5, y: pos.y - bondDir.y * 0.7 + perpDir1.y * 0.5, z: pos.z - bondDir.z * 0.7 + perpDir1.z * 0.5 },
                        { x: pos.x - bondDir.x * 0.7 - perpDir1.x * 0.5, y: pos.y - bondDir.y * 0.7 - perpDir1.y * 0.5, z: pos.z - bondDir.z * 0.7 - perpDir1.z * 0.5 },
                        { x: pos.x - bondDir.x * 0.7 + perpDir2.x * 0.5, y: pos.y - bondDir.y * 0.7 + perpDir2.y * 0.5, z: pos.z - bondDir.z * 0.7 + perpDir2.z * 0.5 }
                    ];
                } else if (i === n-1) {
                    // 最后一个碳：3个氢原子
                    const prevPos = positions[i-1];
                    const bondDir = new THREE.Vector3(prevPos.x - pos.x, prevPos.y - pos.y, prevPos.z - pos.z).normalize();
                    
                    // 创建垂直于键方向的向量
                    let perpDir1 = new THREE.Vector3(-bondDir.y, bondDir.x, 0);
                    if (perpDir1.length() < 0.001) {
                        perpDir1 = new THREE.Vector3(0, -bondDir.z, bondDir.y);
                    }
                    perpDir1.normalize();
                    
                    const perpDir2 = new THREE.Vector3().crossVectors(bondDir, perpDir1).normalize();
                    
                    hPositions = [
                        { x: pos.x - bondDir.x * 0.7 + perpDir1.x * 0.5, y: pos.y - bondDir.y * 0.7 + perpDir1.y * 0.5, z: pos.z - bondDir.z * 0.7 + perpDir1.z * 0.5 },
                        { x: pos.x - bondDir.x * 0.7 - perpDir1.x * 0.5, y: pos.y - bondDir.y * 0.7 - perpDir1.y * 0.5, z: pos.z - bondDir.z * 0.7 - perpDir1.z * 0.5 },
                        { x: pos.x - bondDir.x * 0.7 + perpDir2.x * 0.5, y: pos.y - bondDir.y * 0.7 + perpDir2.y * 0.5, z: pos.z - bondDir.z * 0.7 + perpDir2.z * 0.5 }
                    ];
                } else {
                    // 中间碳：2个氢原子 - 使用真正的四面体几何
                    const prevPos = positions[i-1];
                    const nextPos = positions[i+1];
                    const bondDir1 = new THREE.Vector3(prevPos.x - pos.x, prevPos.y - pos.y, prevPos.z - pos.z).normalize();
                    const bondDir2 = new THREE.Vector3(nextPos.x - pos.x, nextPos.y - pos.y, nextPos.z - pos.z).normalize();
                    const avgDir = new THREE.Vector3().addVectors(bondDir1, bondDir2).normalize();
                    
                    // 创建两个垂直向量用于氢原子定位
                    let perpDir1 = new THREE.Vector3(-avgDir.y, avgDir.x, 0);
                    if (perpDir1.length() < 0.001) {
                        perpDir1 = new THREE.Vector3(0, -avgDir.z, avgDir.y);
                    }
                    perpDir1.normalize();
                    
                    const perpDir2 = new THREE.Vector3().crossVectors(avgDir, perpDir1).normalize();
                    
                    hPositions = [
                        { x: pos.x + perpDir1.x * 0.7, y: pos.y + perpDir1.y * 0.7, z: pos.z + perpDir1.z * 0.7 },
                        { x: pos.x + perpDir2.x * 0.7, y: pos.y + perpDir2.y * 0.7, z: pos.z + perpDir2.z * 0.7 }
                    ];
                }
            }
            
            // 创建氢原子 - 添加安全检查
            for (let hPos of hPositions) {
                if (hPos && typeof hPos.x === 'number' && typeof hPos.y === 'number' && typeof hPos.z === 'number' &&
                    !isNaN(hPos.x) && !isNaN(hPos.y) && !isNaN(hPos.z)) {
                    const hSphere = new THREE.Mesh(hGeometry, hMaterial);
                    hSphere.position.set(hPos.x, hPos.y, hPos.z);
                    group.add(hSphere);
                }
            }
        }
        return group;
    }
    
    let isTransitioning = false;
    let transitionStartMolecule = null;
    let transitionEndMolecule = null;
    let transitionProgress = 0;
    
    function update3DModel(withTransition = false) {
        if (!scene) return;
        
        if (withTransition && !isTransitioning) {
            // 启动过渡动画
            transitionStartMolecule = currentModelGroup ? generateCarbonChain(currentMolecule.carbonCount, currentMolecule, false) : new THREE.Group();
            transitionEndMolecule = generateCarbonChain(currentMolecule.carbonCount, currentMolecule, true);
            transitionProgress = 0;
            isTransitioning = true;
            animateTransition();
        } else {
            // 直接更新模型
            const newGroup = generateCarbonChain(currentMolecule.carbonCount, currentMolecule, false);
            
            // 清理旧模型
            if (currentModelGroup) {
                scene.remove(currentModelGroup);
                disposeGroup(currentModelGroup);
            }
            
            currentModelGroup = newGroup;
            scene.add(currentModelGroup);
            
            // 调整相机视口适应分子大小 - 包括氢原子
            if (currentMolecule.carbonCount > 1) {
                // 计算所有原子位置（包括氢原子）的边界框
                const positions = calculateCarbonPositions(currentMolecule.carbonCount);
                let allPositions = [...positions];
                
                // 估算氢原子位置用于边界框计算
                for (let i = 0; i < currentMolecule.carbonCount; i++) {
                    const pos = positions[i];
                    const hCount = (i === 0 && currentMolecule.carbonCount === 1) ? 4 : 
                                  (i === 0 || i === currentMolecule.carbonCount-1) ? 3 : 2;
                    
                    // 简化估算氢原子位置范围
                    for (let j = 0; j < hCount; j++) {
                        allPositions.push({
                            x: pos.x + (j % 2 === 0 ? 0.7 : -0.7),
                            y: pos.y + (j % 3 === 0 ? 0.7 : -0.7),
                            z: pos.z + (j % 2 === 0 ? 0.5 : -0.5)
                        });
                    }
                }
                
                // 计算边界框
                const minX = Math.min(...allPositions.map(p => p.x));
                const maxX = Math.max(...allPositions.map(p => p.x));
                const minY = Math.min(...allPositions.map(p => p.y));
                const maxY = Math.max(...allPositions.map(p => p.y));
                const minZ = Math.min(...allPositions.map(p => p.z));
                const maxZ = Math.max(...allPositions.map(p => p.z));
                
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const centerZ = (minZ + maxZ) / 2;
                
                const sizeX = maxX - minX;
                const sizeY = maxY - minY;
                const sizeZ = maxZ - minZ;
                const maxSize = Math.max(sizeX, sizeY, sizeZ);
                
                // 调整相机距离和位置
                const distance = Math.max(10, maxSize * 3);
                camera.position.set(distance * 0.8, distance * 0.6, distance * 0.8);
                camera.lookAt(centerX, centerY, centerZ);
                controls.target.set(centerX, centerY, centerZ);
                controls.update();
            }
        }
    }
    
    function animateTransition() {
        if (!isTransitioning) return;
        
        transitionProgress += 0.02; // 2% per frame
        
        if (transitionProgress >= 1.0) {
            // 过渡完成
            isTransitioning = false;
            if (transitionStartMolecule) {
                scene.remove(transitionStartMolecule);
                disposeGroup(transitionStartMolecule);
            }
            currentModelGroup = transitionEndMolecule;
            transitionProgress = 0;
            return;
        }
        
        // 插值动画
        const easeProgress = easeInOutCubic(transitionProgress);
        
        // 更新开始模型的透明度
        if (transitionStartMolecule) {
            transitionStartMolecule.children.forEach(child => {
                if (child.isMesh && child.material) {
                    child.material.opacity = 1 - easeProgress;
                    child.material.transparent = true;
                }
            });
        }
        
        // 更新结束模型的透明度和位置
        if (transitionEndMolecule) {
            transitionEndMolecule.children.forEach(child => {
                if (child.isMesh && child.material) {
                    child.material.opacity = easeProgress;
                    child.material.transparent = true;
                }
            });
        }
    }
    
    function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function triggerRandomEvent() {
        const totalWeight = EVENT_POOL.reduce((sum, e) => sum + e.weight, 0);
        let rand = Math.random() * totalWeight;
        let selected = EVENT_POOL[0];
        for (let e of EVENT_POOL) {
            if (rand < e.weight) { selected = e; break; }
            rand -= e.weight;
        }
        const msg = selected.effect();
        showMessage(`🎲 随机事件: ${msg}`, true);
        updateResourceUI();
    }
    
    async function performReaction(reaction, isTandem = false) {
        if (!gameActive || gameWin) { showMessage("游戏已结束，请重新开局。", false); return false; }
        
        // 检查目标分子约束
        if (!checkReactionConstraints(reaction)) {
            return false;
        }
        
        // 检查前体要求
        if (!reaction.precursorCheck(currentMolecule)) {
            let requirement = "";
            if (reaction.id === "grignard") requirement = "羰基 (=O, -CHO, -COOH)";
            else if (reaction.id === "aldol") requirement = "含α-氢的羰基化合物";
            else if (reaction.id === "williamson") requirement = "羟基 (-OH)";
            else if (reaction.id === "reduction") requirement = "羰基 (=O, -CHO, -COOH)";
            else if (reaction.id === "oxidation") requirement = "羟基 (-OH)";
            else if (reaction.id === "diels_alder") requirement = "共轭二烯结构";
            
            showMessage(`❌ 当前分子不符合反应要求：需要${requirement}`, false);
            return false;
        }
        
        let mgCost = reaction.costMg;
        if (techMgEfficiency && reaction.id === "grignard") mgCost = Math.ceil(mgCost / 2);
        if (mgCost > magnesium) { showMessage(`❌ 镁不足，需要 ${mgCost}`, false); return false; }
        if (reaction.costCu > copper) { showMessage(`❌ 铜不足，需要 ${reaction.costCu}`, false); return false; }
        if (reaction.costPd > palladium) { showMessage(`❌ 钯不足，需要 ${reaction.costPd}`, false); return false; }
        
        // 串联反应技术：节约1回合
        let turnCost = reaction.costTurn;
        if (isTandem && techTandem && turnCost > 1) {
            turnCost = turnCost - 1;
        }
        
        if (turnsLeft < turnCost) { showMessage(`❌ 回合不足，需要 ${turnCost}`, false); return false; }
        if (currentMolecule.carbonCount < reaction.minCarbon) { 
            showMessage(`❌ 碳链太短 (${currentMolecule.carbonCount}C)，需要至少 ${reaction.minCarbon}C`, false); 
            return false; 
        }
        
        magnesium -= mgCost;
        copper -= reaction.costCu;
        palladium -= reaction.costPd;
        turnsLeft -= turnCost;
        reactionCount++;
        
        let success = true;
        let extraMsg = "";
        const yieldRoll = Math.random();
        
        // 显示反应方程式
        if (reaction.equation) {
            showReactionEquation(reaction.equation);
        }
        
        const effectiveYield = calculateEffectiveYield(reaction);
        if (yieldRoll > effectiveYield) {
            success = false;
            extraMsg = ` 产率不足，反应失败！(有效产率: ${Math.round(effectiveYield * 100)}%)`;
        } else {
            const sideRoll = Math.random();
            if (sideRoll < reaction.sideEffectChance) {
                success = false;
                extraMsg = ` 副反应：${reaction.sideEffectDesc}`;
            }
        }
        
        let oldMolecule = currentMolecule.clone();
        let oldDescription = currentMolecule.getDescription();
        
        if (success) {
            // 应用反应转换
            currentMolecule = reaction.transform(currentMolecule);
            if (techAldolGreen && reaction.id === "aldol") {
                extraMsg += " (绿色羟醛缩合，无副产物)";
            }
        } else {
            // 处理副反应情况 - 保持原分子不变
            if (reaction.id === "aldol" && extraMsg.includes("脱水不完全")) {
                // 特殊处理：羟醛缩合部分成功
                currentMolecule.carbonCount += 1;
                extraMsg += " (实际增加1个碳)";
            }
        }
        
        if (currentMolecule.carbonCount > carbonBudget) {
            showMessage(`⚠️ 碳链超过预算 (${carbonBudget}C)，但游戏继续`, true);
        }
        if (success) researchPoints++;
        
        let msg = `${success ? '✅' : '❌'} ${reaction.name}！\n${oldDescription} → ${currentMolecule.getDescription()}\n${extraMsg}`;
        showMessage(msg, success);
        
        if (reactionCount % 3 === 0 && gameActive && !gameWin) {
            triggerRandomEvent();
        }
        
        updateResourceUI();
        carbonCountSpan.innerText = currentMolecule.carbonCount;
        moleculeDetailSpan.innerText = `分子结构: ${currentMolecule.getDescription()}`;
        update3DModel(success);  // 使用过渡动画更新3D分子模型
        
        // 检查胜利条件
        if (checkVictoryConditions()) {
            gameActive = false;
            gameWin = true;
            const finalScore = calculateScore();
            saveHighScore(finalScore);
            showMessage(`🎉 胜利！成功合成目标分子 ${targetMolecule.name}！\n${currentMolecule.getDescription()}\n最终得分: ${finalScore} 🎉`, true);
            updateUI(); return true;
        }
        if (turnsLeft <= 0) {
            gameActive = false;
            gameWin = false;
            showMessage(`💀 回合耗尽，未达到目标分子 ${targetMolecule.name}。游戏失败。`, false);
            updateUI(); return false;
        }
        updateUI();
        return true;
    }

    function showReactionEquation(equation) {
        const equationDiv = document.createElement('div');
        equationDiv.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            box-shadow: 0 4px 20px rgba(0,0,0,0.5);

        `;
        equationDiv.innerHTML = `

        `;

        setTimeout(() => {

    function calculateScore() {
        let score = (currentMolecule.carbonCount / targetCarbon) * 100;
        score -= (15 - turnsLeft) * 2;
        score -= (3 - magnesium) * 5;
        score -= (2 - copper) * 3;
        score -= (1 - palladium) * 8;
        score += researchPoints * 2;
        return Math.max(0, Math.floor(score));
    }
    
    function saveHighScore(score) {
        let scores = JSON.parse(localStorage.getItem('carbon_highscores') || '[]');
        scores.push({ score: score, date: new Date().toLocaleString(), carbon: currentMolecule.carbonCount, molecule: currentMolecule.getDescription() });
        scores.sort((a,b) => b.score - a.score);
        scores = scores.slice(0, 8);
        localStorage.setItem('carbon_highscores', JSON.stringify(scores));
        displayHighScores();
    }
    
    function displayHighScores() {
        let scores = JSON.parse(localStorage.getItem('carbon_highscores') || '[]');
        if (scores.length) {
            let topText = "🏆 高分榜: " + scores.slice(0,3).map((s,i) => `${i+1}. ${s.score}分`).join(", ");
            feedbackMsg.innerHTML = topText + "<br>" + (feedbackMsg.innerHTML.split("<br>")[1] || "");
        }
    }
    
    function openTechTree() {
        let options = TECH_TREE.map(tech => {
            let purchased = (tech.id === "efficient_mg" && techMgEfficiency) ||
                           (tech.id === "green_aldol" && techAldolGreen) ||
                           (tech.id === "atomic_economy" && techAtomicDisplay) ||
                           (tech.id === "tandem_reaction" && techTandem);
            return `${tech.name} (${tech.cost}点) - ${tech.effect} ${purchased ? '✅已解锁' : ''}`;
        }).join("\n");
        let choice = prompt("科技树升级（输入编号）:\n1. 高效镁试剂 (5)\n2. 绿色羟醛缩合 (8)\n3. 原子经济洞察 (3)\n4. 串联反应 (10)\n当前研究点: " + researchPoints);
        if (choice === "1" && !techMgEfficiency && researchPoints >= 5) {
            techMgEfficiency = true; researchPoints -= 5; showMessage("🔧 解锁：高效镁试剂（镁消耗减半）", true);
        } else if (choice === "2" && !techAldolGreen && researchPoints >= 8) {
            techAldolGreen = true; researchPoints -= 8; showMessage("🌿 解锁：绿色羟醛缩合", true);
        } else if (choice === "3" && !techAtomicDisplay && researchPoints >= 3) {
            techAtomicDisplay = true; researchPoints -= 3; showMessage("📊 解锁：原子经济洞察", true);
        } else if (choice === "4" && !techTandem && researchPoints >= 10) {
            techTandem = true; researchPoints -= 10; showMessage("⚙️ 解锁：串联反应", true);
        } else { showMessage("无法解锁，研究点不足或已解锁", false); }
        updateResourceUI();
        renderReactions();
    }
    
    function renderReactions() {
        reactionGrid.innerHTML = '';
        for (let r of REACTIONS) {
            let disabled = (!gameActive || gameWin);
            let mgCost = r.costMg;
            if (techMgEfficiency && r.id === "grignard") mgCost = Math.ceil(mgCost / 2);
            if (mgCost > magnesium) disabled = true;
            if (r.costCu > copper) disabled = true;
            if (r.costPd > palladium) disabled = true;
            if (turnsLeft < r.costTurn) disabled = true;
            if (currentMolecule.carbonCount < (r.minCarbon || 0)) disabled = true;
            
            // 检查前体要求
            if (!r.precursorCheck(currentMolecule)) {
                disabled = true;
            }
            
            const card = document.createElement('div');
            card.className = `reaction-card ${disabled ? 'disabled' : ''}`;
            
            // 计算碳数变化
            const testMol = currentMolecule.clone();
            const newMol = r.transform(testMol);
            const carbonChange = newMol.carbonCount - currentMolecule.carbonCount;
            let gainText = carbonChange > 0 ? `+${carbonChange}C` : carbonChange < 0 ? `${carbonChange}C` : "不变";
            
            let turnCost = r.costTurn;
            if (techTandem && turnCost > 1) {
                turnCost = turnCost - 1;
            }
            let turnText = techTandem && r.costTurn > 1 ? `${turnCost}(${r.costTurn-1})` : `${r.costTurn}`;
            const effectiveYield = calculateEffectiveYield(r);
            let yieldText = techAtomicDisplay ? ` 产率: ${Math.round(effectiveYield * 100)}%` : "";
            
            // 显示前体要求状态
            let requirementStatus = r.precursorCheck(currentMolecule) ? "✅" : "❌";
            
            // 显示溶剂效果
            let solventEffect = "";
            const solvent = SOLVENTS[currentSolvent];
            if (solvent.effects[r.id]) {
                const effect = solvent.effects[r.id];
                if (effect.yield !== 0) {
                    solventEffect = ` 溶剂: ${effect.yield > 0 ? '+' : ''}${Math.round(effect.yield * 100)}%`;
                }
            }
            
            card.innerHTML = `
                <div class="reaction-name">${r.name} ${requirementStatus}</div>
                <div class="reaction-desc">${r.desc}</div>
                <div class="reaction-stats">
                    <span class="stat-badge">📈 ${gainText}</span>
                    <span class="stat-badge">⏱️ ${turnText}回合</span>
                    ${mgCost ? `<span class="stat-badge">⚡ Mg x${mgCost}</span>` : ''}
                    ${r.costCu ? `<span class="stat-badge">🔷 Cu x${r.costCu}</span>` : ''}
                    ${r.costPd ? `<span class="stat-badge">⚙️ Pd x${r.costPd}</span>` : ''}
                    ${yieldText}
                    ${solventEffect ? `<span class="stat-badge">🧪 ${solventEffect}</span>` : ''}
                    ${techTandem && r.costTurn > 1 ? `<span class="stat-badge">⚡ 串联</span>` : ''}
                </div>
                <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px;">
                    ${r.tooltip}
                </div>
            `;
            if (!disabled) card.addEventListener('click', () => performReaction(r, techTandem && r.costTurn > 1));
            reactionGrid.appendChild(card);
        }
    }
