    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTsLoad" async defer></script>
    <div id="ts-widget" style="display:none"></div>
    <script>
      /* Turnstile：invisible 自动执行，用 getResponse 拿 token */
      var _tsToken = '';
      var _tsWidgetId = null;
      function onTsLoad(){
        _tsWidgetId = turnstile.render('#ts-widget', {
          sitekey: '0x4AAAAAADqUdZ6DijZSsAks',
          size: 'invisible',
          callback: function(t){ _tsToken = t; }
        });
        setInterval(function(){
          _tsToken = '';
          turnstile.reset(_tsWidgetId);
        }, 280000); // 300s 有效期，280s 刷新
      }

      /* fetch 拦截：token 为空时等一等，最多 3 秒 */
      (function(){
        var raw = window.fetch;
        window.fetch = function(url, opts){
          if (typeof url === 'string' && url === '/api/chat' && opts && opts.body) {
            return new Promise(function(resolve){
              function send(){
                try { var b = JSON.parse(opts.body); b.turnstileToken = _tsToken||''; opts.body = JSON.stringify(b); } catch(e){}
                resolve(raw(url, opts));
              }
              if (_tsToken) return send();
              // 没 token，触发一次并等待
              if (_tsWidgetId && typeof turnstile !== 'undefined') {
                try { turnstile.execute(_tsWidgetId, { action: 'chat' }); } catch(e){}
              }
              var waited = 0;
              var check = setInterval(function(){
                waited += 100;
                if (_tsToken || waited >= 3000) { clearInterval(check); send(); }
              }, 100);
            });
          }
          return raw(url, opts);
        };
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-B79EhL8X.js"></script>

  <body>
    <div id="root"></div>
    <!-- 月读装饰物件 -->
    <!-- 月读概念背景 -->
    <div class="tsuki-bg-layer" aria-hidden="true"></div>
    <div class="neon-cloud-top" aria-hidden="true"></div>
    <div class="neon-cloud-bottom" aria-hidden="true"></div>
    <div class="neon-fish" aria-hidden="true"></div>
    <div class="neon-octopus" aria-hidden="true"></div>
    <div class="sparkle sparkle-1" aria-hidden="true"></div>
    <div class="sparkle sparkle-2" aria-hidden="true"></div>
    <div class="sparkle sparkle-3" aria-hidden="true"></div>
    <!-- 小八千代精灵动画 -->
    <div class="yachiyo-sprite" aria-hidden="true"></div>
    <div class="tsuki-light tsuki-light-main" aria-hidden="true"></div>
    <div class="tsuki-light tsuki-light-sub" aria-hidden="true"></div>
    <script>
      /* 小八千代精灵动画 + 游戏事件响应 */
      (function(){
        var el = document.querySelector('.yachiyo-sprite');
        if(!el) return;
        /* 每行帧数: 0眨眼(6) 1右跑(8) 2左跑(8) 3招手(4) 4小跳(5) 5哭(8) 6乐眨眼(6) 7单双眼(6) 8说话(8) */
        var FRAMES = [6,8,8,4,5,8,6,6,8];
        var fps = 8;
        var frame = 0, row = 3; /* 初始：招手 */
        var timer = null;
        var idleTimer = null;
        var w = el.offsetWidth, h = el.offsetHeight;

        function tick(){
          var maxF = FRAMES[row];
          frame = (frame + 1) % maxF;
          el.style.backgroundPositionX = -(frame * w) + 'px';
          el.style.backgroundPositionY = -(row * h) + 'px';
          el.style.backgroundSize = (w * 8) + 'px ' + (h * 9) + 'px';
        }

        function setRow(r, duration){
          row = r; frame = 0;
          if(timer) clearInterval(timer);
          timer = setInterval(tick, 1000/fps);
          if(idleTimer) clearTimeout(idleTimer);
          if(duration){
            idleTimer = setTimeout(function(){ setRow(0); }, duration);
          }
        }

        /* 初始招手 3s → 待机 */
        setTimeout(function(){ setRow(0); }, 3000);

        /* 观察游戏状态 */
        var obs = new MutationObserver(function(ms){
          ms.forEach(function(m){
            m.addedNodes.forEach(function(n){
              if(n.nodeType!==1) return;
              var t = n.textContent||'';
              /* 玩家发消息 → 待机 */
              if(n.classList.contains('ml-auto')){ setRow(0, 8000); }
              /* AI 回复 → 说话 */
              if(n.classList.contains('items-start') && t.length>30){
                setRow(8, 5000);
                /* 包含 SOLVED → 乐眨眼→小跳 */
                if(t.indexOf('[SOLVED]')>=0 || t.indexOf('【SOLVED】')>=0){
                  setRow(6, 1200);
                  setTimeout(function(){ setRow(4, 1500); }, 1400);
                }
              }
            });
            /* 检测错误 */
            if(m.target.textContent && m.target.textContent.indexOf('抱歉')>=0 && m.target.textContent.indexOf('走神')>=0){
              setRow(5, 2500);
            }
          });
        });
        (function watch(){
          var root = document.getElementById('root');
          if(root){ obs.observe(root, {childList:true,subtree:true,characterData:true}); }
          else setTimeout(watch, 500);
        })();

        window.addEventListener('resize',function(){
          w = el.offsetWidth; h = el.offsetHeight;
        });
      })();
    </script>
    <script>
      /* 交互光束：检测新消息，加强对应方向光束 */
      (function(){
        var main = document.querySelector('.tsuki-light-main');
        var sub  = document.querySelector('.tsuki-light-sub');
        if(!main||!sub) return;
        var timeout;
        function flash(el){
          el.classList.add('tsuki-light--active');
          clearTimeout(timeout);
          timeout = setTimeout(function(){ el.classList.remove('tsuki-light--active'); }, 1200);
        }
        var obs = new MutationObserver(function(ms){
          ms.forEach(function(m){
            m.addedNodes.forEach(function(n){
              if(n.nodeType!==1) return;
              if(n.classList.contains('ml-auto')){ flash(sub); }
              else if(n.classList.contains('items-start') && n.textContent && n.textContent.length>20){ flash(main); }
            });
          });
        });
        (function watch(){
          var root = document.getElementById('root');
          if(root){ obs.observe(root, {childList:true,subtree:true}); }
          else setTimeout(watch, 500);
        })();
      })();
    </script>
