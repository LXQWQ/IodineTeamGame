<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>化学海龟汤 · 月见八千代</title>
    <style>
      /* === 月读空间 · 月见八千代 主题 === */
      :root {
        --color-emerald-400: #e04090;
        --color-emerald-500: #ff6bb5;
        --color-emerald-900: #1e2235;
        --color-red-400: #ff6b6b;
        --color-red-500: #ff4444;
        --color-zinc-100: #e8e4ef;
        --color-zinc-300: #b8b4cc;
        --color-zinc-400: #9a96b5;
        --color-zinc-500: #7a7695;
        --color-zinc-600: #5a5675;
        --color-zinc-700: #3b3850;
        --color-zinc-800: #262b3d;
        --color-zinc-900: #1e2235;
        --color-zinc-950: #151322;
        --tsuki-accent: #e04090;
        --tsuki-accent-cyan: #00b8d4;
        --tsuki-accent-gold: #ffb74d;
        --tsuki-glow: rgba(224, 64, 144, 0.25);
        --tsuki-bg: #1e2235;
        --tsuki-card: #262b3d;
        --tsuki-text: #e8e4ef;
        --tsuki-text-dim: #9a96b5;
        --tsuki-border: #3b3850;
      }
      html, body {
        height: 100%; overflow: hidden;
        background: transparent !important;
        font-family: system-ui,-apple-system,'Segoe UI','Poppins','Roboto',sans-serif;
      }
      /* 覆盖所有硬编码背景为透明，让 pseudo-elements 透出来 */
      .bg-\[\#0a0a0c\], [class*="bg-zinc-950"], [class*="bg-zinc-900"] {
        background-color: transparent !important;
      }
      /* 确保容器有半透明背景 */
      .bg-zinc-900\\/50, .bg-zinc-900\\/80, .bg-zinc-900\\/95 {
        background-color: rgba(30,34,53,0.7) !important;
      }
      /* 底部输入栏保留实色 */
      .bg-zinc-900\\/80.border-t {
        background-color: rgba(21,19,34,0.92) !important;
      }

      /* === 背景氛围（参考辉夜姬官网三层叠加灯光） === */
      body::before {
        content: '' !important; display: block !important; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          /* 月亮光晕 */
          radial-gradient(ellipse 60vw 50vh at 50% 30%, rgba(224,64,144,0.07) 0%, transparent 60%),
          /* 青色辅助光 */
          radial-gradient(ellipse 40vw 35vh at 80% 55%, rgba(0,184,212,0.05) 0%, transparent 50%),
          /* 金色暖光 */
          radial-gradient(ellipse 50vw 40vh at 20% 75%, rgba(255,183,77,0.04) 0%, transparent 50%),
          linear-gradient(180deg, #0d0a1a 0%, #1e2235 40%, #1a1d2e 100%);
        animation: tsuki-bg-breathe 15s ease-in-out infinite;
      }
      @keyframes tsuki-bg-breathe {
        0%,100% { opacity: 1; }
        50% { opacity: 0.82; }
      }

      /* 星光粒子层 */
      body::after {
        content: '' !important; display: block !important;
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(2px 2px at 8% 18%, rgba(255,183,77,0.8), transparent),
          radial-gradient(1.5px 1.5px at 22% 10%, rgba(224,64,144,0.7), transparent),
          radial-gradient(1.5px 1.5px at 35% 62%, rgba(0,184,212,0.6), transparent),
          radial-gradient(2px 2px at 48% 20%, rgba(255,183,77,0.7), transparent),
          radial-gradient(1.5px 1.5px at 55% 70%, rgba(224,64,144,0.6), transparent),
          radial-gradient(1.5px 1.5px at 68% 25%, rgba(0,184,212,0.6), transparent),
          radial-gradient(2px 2px at 78% 65%, rgba(224,64,144,0.55), transparent),
          radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,183,77,0.7), transparent),
          radial-gradient(2.5px 2.5px at 12% 78%, rgba(224,64,144,0.5), transparent),
          radial-gradient(2px 2px at 92% 42%, rgba(0,184,212,0.45), transparent);
        animation: tsuki-stars-drift 25s linear infinite;
      }
      @keyframes tsuki-stars-drift {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
        100% { transform: translateY(-30px) scale(1); }
      }

      #root { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }

      /* 滚动条 */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--tsuki-card); }
      ::-webkit-scrollbar-thumb { background: var(--tsuki-accent); border-radius: 3px; border: 1px solid var(--tsuki-border); }
      ::-webkit-scrollbar-thumb:hover { background: var(--tsuki-accent-cyan); }

      /* 选中文字 */
      ::selection { background: rgba(224,64,144,0.3); color: #e8e4ef; }

      /* 卡片容器：辉夜姬风格柔光边框 */
      [class*="bg-zinc-900/50"], [class*="bg-zinc-900/80"], [class*="bg-zinc-900/95"] {
        box-shadow: 0 0 40px rgba(224,64,144,0.15), inset 0 1px 0 rgba(224,64,144,0.18) !important;
        border-color: var(--tsuki-border) !important;
        backdrop-filter: blur(8px);
      }
      [class*="rounded-2xl"] {
        border-color: rgba(224,64,144,0.2) !important;
      }

      /* 标题发光 */
      .text-emerald-400, .text-emerald-500 {
        text-shadow: 0 0 20px var(--tsuki-glow), 0 0 40px rgba(0,184,212,0.2);
      }

      /* 输入框：辉夜姬风格聚焦 */
      input, textarea {
        transition: all 0.4s ease !important;
      }
      input:focus, textarea:focus {
        border-color: var(--tsuki-accent) !important;
        box-shadow: 0 0 18px var(--tsuki-glow), inset 0 0 8px rgba(224,64,144,0.06) !important;
      }

      /* 按钮渐变：辉夜姬三色（粉→青→金） */
      .bg-emerald-500, button.bg-emerald-500 {
        background: linear-gradient(135deg, var(--tsuki-accent), var(--tsuki-accent-cyan)) !important;
        border: none !important;
        transition: all 0.4s ease !important;
      }
      button.bg-emerald-500:hover, .bg-emerald-500:hover {
        background: linear-gradient(135deg, var(--tsuki-accent-cyan), var(--tsuki-accent-gold)) !important;
        box-shadow: 0 0 20px var(--tsuki-glow) !important;
        transform: translateY(-1px);
      }

      /* 次要按钮悬停 */
      button.bg-zinc-800:hover, button.bg-zinc-700:hover {
        border-color: var(--tsuki-accent) !important;
        box-shadow: 0 0 10px rgba(224,64,144,0.15) !important;
      }

      /* 难度指示器发光 */
      .shadow-\\[0_0_8px_rgba\\(16\\,185\\,129\\,0\\.5\\)\\] {
        box-shadow: 0 0 8px var(--tsuki-glow) !important;
      }

      /* 链接高亮 */
      a:hover { color: var(--tsuki-accent-cyan) !important; }

      /* === 月读光束（introduction_light 图片叠加） === */
      .tsuki-light {
        position: fixed; pointer-events: none; z-index: 3;
        background-image: url('../../effects/introduction_light.webp');
        background-size: cover; background-position: center;
        mix-blend-mode: screen;
        opacity: 0;
      }
      .tsuki-light-main {
        top: -20%; left: -25%;
        width: 150%; height: 150%;
        animation: light-entrance 3s ease-out forwards, light-pulse 8s ease-in-out infinite 3s;
        transform-origin: center top;
      }
      .tsuki-light-sub {
        bottom: -20%; left: -10%;
        width: 120%; height: 100%;
        transform: rotate(180deg);
        animation: light-entrance 3.5s ease-out forwards 0.5s, light-pulse 10s ease-in-out infinite 3.5s;
        opacity: 0.15;
      }
      .tsuki-light--active {
        opacity: 0.7 !important;
        transition: opacity 0.3s ease;
      }
      @keyframes light-entrance {
        0% { opacity: 0; transform: translateY(50px) scale(1.2); }
        30% { opacity: 0.2; transform: translateY(25px) scale(1.1); }
        60% { opacity: 0.35; transform: translateY(10px) scale(1.05); }
        100% { opacity: 0.28; transform: translateY(0) scale(1); }
      }
      @keyframes light-pulse {
        0%,100% { opacity: 0.28; }
        50% { opacity: 0.38; }
      }
      @media (max-width: 768px) {
        .tsuki-light-main { top: -10%; left: -20%; width: 140%; height: 120%; }
        .tsuki-light-sub { bottom: -10%; left: -5%; width: 110%; height: 80%; }
      }
      .neon-fish, .neon-cloud-top, .neon-cloud-bottom, .neon-octopus, .sparkle {
        position: fixed; pointer-events: none; z-index: 2;
        background-size: contain; background-repeat: no-repeat;
        opacity: 0;
      }
      .neon-fish {
        top: 12%; right: 5%;
        width: 70px; height: 50px;
        background-image: url('../../effects/deco_neon-fish.webp');
        animation: deco-fade-in 2s ease-out forwards 0.8s, fish-swim 13s ease-in-out infinite 2s;
      }
      .neon-octopus {
        bottom: 25%; left: 5%;
        width: 85px; height: 65px;
        background-image: url('../../effects/deco_neon-octopus.webp');
        animation: deco-fade-in 2s ease-out forwards 1.6s, octo-float 16s ease-in-out infinite 2s;
      }
      .neon-cloud-top {
        top: 3%; left: 18%;
        width: 130px; height: 65px;
        background-image: url('../../effects/deco_neon-cloud1.webp');
        animation: deco-fade-in 2s ease-out forwards 1.2s, cloud-drift 20s ease-in-out infinite 2s;
      }
      .neon-cloud-bottom {
        bottom: 8%; right: 8%;
        width: 105px; height: 55px;
        background-image: url('../../effects/deco_neon-cloud2.webp');
        animation: deco-fade-in 2s ease-out forwards 1.8s, cloud-drift 24s ease-in-out infinite 2s;
      }
      /* 闪烁星光 */
      .sparkle {
        width: 30px; height: 30px;
        background-image: url('../../effects/icon_flash1.webp');
      }
      .sparkle-1 { top: 18%; left: 40%; animation: sparkle-flicker 4s ease-in-out infinite 0.5s; }
      .sparkle-2 { top: 55%; right: 22%; animation: sparkle-flicker 5s ease-in-out infinite 1.5s; background-image: url('../../effects/icon_flash2.webp'); }
      .sparkle-3 { top: 35%; left: 60%; animation: sparkle-flicker 4.5s ease-in-out infinite 2.5s; background-image: url('../../effects/icon_flash3.webp'); }
      @keyframes sparkle-flicker {
        0%,100% { opacity: 0; transform: scale(0.3); }
        30% { opacity: 0.6; transform: scale(1); }
        60% { opacity: 0.15; transform: scale(0.5); }
      }
      @keyframes deco-fade-in {
        0% { opacity: 0; transform: scale(0.4) translateY(20px); }
        100% { opacity: 0.65; transform: scale(1) translateY(0); }
      }
      @keyframes fish-swim {
        0%,100% { transform: translate(0,0) rotate(0deg); }
        25% { transform: translate(-25px,-12px) rotate(4deg); }
        50% { transform: translate(-45px,6px) rotate(-3deg); }
        75% { transform: translate(-18px,-10px) rotate(3deg); }
      }
      @keyframes octo-float {
        0%,100% { transform: translate(0,0) rotate(0deg); }
        33% { transform: translate(15px,-18px) rotate(5deg); }
        66% { transform: translate(-10px,-8px) rotate(-4deg); }
      }
      @keyframes cloud-drift {
        0%,100% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
      }
      @media (max-width: 768px) {
        .neon-fish { width: 40px; height: 30px; top: 6%; right: 2%; }
        .neon-octopus { width: 55px; height: 42px; bottom: 30%; left: 2%; }
        .neon-cloud-top { width: 80px; height: 40px; left: 3%; }
        .neon-cloud-bottom { width: 65px; height: 35px; bottom: 12%; right: 2%; }
        .sparkle { width: 20px; height: 20px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B79EhL8X.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DeP_rnF9.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 月读装饰物件 -->
    <div class="neon-cloud-top" aria-hidden="true"></div>
    <div class="neon-cloud-bottom" aria-hidden="true"></div>
    <div class="neon-fish" aria-hidden="true"></div>
    <div class="neon-octopus" aria-hidden="true"></div>
    <div class="sparkle sparkle-1" aria-hidden="true"></div>
    <div class="sparkle sparkle-2" aria-hidden="true"></div>
    <div class="sparkle sparkle-3" aria-hidden="true"></div>
    <div class="tsuki-light tsuki-light-main" aria-hidden="true"></div>
    <div class="tsuki-light tsuki-light-sub" aria-hidden="true"></div>
    <script>
      /* 交互光束：检测新消息，加强对应方向光束 */
      (function(){
        var main = document.querySelector('.tsuki-light-main');
        var sub  = document.querySelector('.tsuki-light-sub');
        if(!main||!sub) return;
        var timeout;
        function flash(el){
          el.classList.add('tsuki-light--active');
          clearTimeout(timeout);
          timeout = setTimeout(function(){ el.classList.remove('tsuki-light--active'); }, 1200);
        }
        var obs = new MutationObserver(function(ms){
          ms.forEach(function(m){
            m.addedNodes.forEach(function(n){
              if(n.nodeType!==1) return;
              if(n.classList.contains('ml-auto')){ flash(sub); }
              else if(n.classList.contains('items-start') && n.textContent && n.textContent.length>20){ flash(main); }
            });
          });
        });
        (function watch(){
          var root = document.getElementById('root');
          if(root){ obs.observe(root, {childList:true,subtree:true}); }
          else setTimeout(watch, 500);
        })();
      })();
    </script>
  </body>
</html>
