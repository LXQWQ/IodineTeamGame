<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相转移大作战 · 相图博弈</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">

  <!-- 音乐播放器 -->
  <div class="music-player">
    <button class="music-toggle-btn" id="musicToggleBtn" title="音乐播放控制">
      <span class="music-icon">🎵</span>
      <span class="music-status" id="musicStatus">暂停</span>
    </button>
    <div class="music-dropdown" id="musicDropdown">
      <div class="music-header">
        <span>🎵 背景音乐</span>
        <button class="music-close-btn" id="musicCloseBtn">✕</button>
      </div>
      <div class="music-controls">
        <button class="music-control-btn" id="musicPlayPauseBtn">▶️ 播放</button>
        <button class="music-control-btn" id="musicStopBtn">⏹️ 停止</button>
        <button class="music-control-btn" id="musicNextBtn">⏭️ 下一首</button>
      </div>
      <div class="music-volume-control">
        <span>🔊 音量</span>
        <input type="range" id="musicVolume" min="0" max="100" value="50" class="volume-slider">
        <span id="volumeValue">50%</span>
      </div>
      <div class="music-playlist" id="musicPlaylist"></div>
    </div>
  </div>

  <header class="hd">
    <h1>相转移大作战</h1>
    <p class="sub">把物质<b>留在</b>自己的相区一整轮，才算赢</p>
  </header>

  <!-- 对局设置 -->
  <section class="setup" id="setup">
    <div class="setup-row">
      <span class="lb">对手</span>
      <div class="seg" id="foeSeg">
        <button data-foe="ai" class="on">🤖 人机对战</button>
        <button data-foe="pvp">👥 双人同屏</button>
      </div>
    </div>
    <div class="setup-row" id="diffRow">
      <span class="lb">AI 强度</span>
      <div class="seg" id="diffSeg">
        <button data-diff="easy">简单</button>
        <button data-diff="medium" class="on">中等</button>
        <button data-diff="hard">困难</button>
      </div>
    </div>
    <div class="setup-row">
      <span class="lb">物质</span>
      <div class="seg" id="subSeg">
        <button data-sub="random" class="on">🎲 随机</button>
        <button data-sub="pick">📋 指定</button>
      </div>
    </div>
    <div class="sub-pick" id="subPick"></div>
    <button class="btn-start" id="btnStart">开始对局 →</button>
  </section>

  <!-- 对局 -->
  <section class="board" id="board">
    <div class="side left" id="sideLeft">
      <div class="side-top">
        <span class="who">🔴 你</span>
        <span class="occ" id="occL">未占领</span>
      </div>
      <div class="goal" id="goalL">—</div>
      <div class="meter"><i id="enL"></i></div>
      <div class="en-txt"><span id="enLtxt">3</span> ⚡</div>
    </div>

    <div class="center">
      <div class="mat-head">
        <span class="mat-name" id="matName">—</span>
        <span class="mat-state" id="matState">—</span>
      </div>

      <div class="phase-map" id="phaseMap">
        <div class="axis-y" id="axisY"></div>
        <div class="axis-x" id="axisX"></div>
        <div class="grid" id="grid"></div>
        <div class="token" id="token"><span id="tokenIcon">🧪</span></div>
      </div>

      <div class="readout">
        <div><span>温度</span><b id="rTemp">25°C</b></div>
        <div><span>压强</span><b id="rPress">1.0 atm</b></div>
        <div><span>热力学相</span><b id="rPhase">固相</b></div>
        <div><span>溶剂环境</span><b id="rSolv">无</b></div>
      </div>

      <div class="turnbar" id="turnbar">—</div>
    </div>

    <div class="side right" id="sideRight">
      <div class="side-top">
        <span class="who" id="whoR">🔵 对手</span>
        <span class="occ" id="occR">未占领</span>
      </div>
      <div class="goal" id="goalR">—</div>
      <div class="meter"><i id="enR"></i></div>
      <div class="en-txt"><span id="enRtxt">3</span> ⚡</div>
    </div>
  </section>

  <!-- 手牌 -->
  <section class="hand-area">
    <div class="hand-head">
      <span>🎴 反应条件卡牌</span>
      <span class="hint" id="handHint">点卡牌使用 · 每回合 +3⚡</span>
      <button id="resetGameBtn" class="reset-btn">🔄 新对局</button>
    </div>
    <div class="cards" id="cardsContainer"></div>
    <div class="game-message" id="gameMessage"></div>
  </section>

  <footer class="ft">
    🧪 规则：卡牌改变温度/压强/溶剂 → 物质在相图上移动；停在自己的目标格并且撑过对手一回合，即获胜。
  </footer>
</div>

<!-- 结算 -->
<div class="over" id="over">
  <div class="over-box">
    <div class="over-trophy" id="overIcon">🏆</div>
    <h2 id="overTitle">胜利</h2>
    <p id="overSub">—</p>
    <div class="over-stats" id="overStats"></div>
    <div class="over-btns">
      <button id="ovAgain" class="btn-again">再来一局</button>
      <button id="ovSetup" class="btn-ghost">返回设置</button>
    </div>
  </div>
</div>

<script src="music.js"></script>
<script src="app.js"></script>
</body>
</html>
