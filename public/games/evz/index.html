<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>元素大战僵尸Pro · 物质炼金纪元</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部 HUD -->
<div class="hud">
  <div class="hud-title"><span class="logo">⚛️</span><b>元素大战僵尸</b><small>物质炼金纪元</small></div>
  <div class="hud-stats">
    <div class="stat"><span class="k">电子</span><span class="v" id="vEsp">150</span><i class="u">⚡</i></div>
    <div class="stat"><span class="k">积分</span><span class="v" id="vSc">0</span></div>
    <div class="stat"><span class="k">最高</span><span class="v dim" id="vBest">0</span></div>
    <div class="stat"><span class="k">僵尸</span><span class="v" id="vWv">0</span></div>
    <div class="stat" id="cdStat"><span class="k">入侵倒数</span><span class="v" id="vCd">30</span><i class="u">s</i></div>
    <div class="stat"><span class="k">物质</span><span class="v" id="vSub">0</span></div>
    <div class="stat boss" id="bsStat" style="display:none"><span class="k">Boss</span><span class="v" id="vBs">0</span></div>
  </div>
</div>

<div class="main">
  <!-- 元素库 -->
  <aside class="sidebar">
    <div class="side-head">⚛️ 周期表元素库</div>
    <div class="side-body" id="sideC"></div>
  </aside>

  <!-- 战场 -->
  <div class="game-area">
    <div class="canvas-wrap">
      <canvas id="gc"></canvas>
      <div class="wave-banner" id="waveBanner"></div>
    </div>
    <div class="msg-bar" id="msg">⚛️ 选元素→放置战场 ｜ 僵尸死亡产物取决于击杀方式 ｜ 实验室提取新元素</div>
    <div class="ctrl-row">
      <div class="btns">
        <button class="btn" id="btnRe">🔄 重开</button>
        <button class="btn" id="btnRk">📊 排行</button>
        <button class="btn" id="btnGd">📖 图鉴</button>
      </div>
      <div class="btns">
        <button class="btn boss-btn" id="btnB1" style="display:none">🏭 哈伯-博斯</button>
        <button class="btn boss-btn" id="btnB2" style="display:none">⚡ 自由基</button>
        <button class="btn boss-btn" id="btnB3" style="display:none">☠️ 重金属</button>
      </div>
    </div>
    <div class="ft">🧪 死亡产物即真实化学反应结果 ｜ Na 杀水基僵尸→NaOH ｜ 酸碱中和→盐+水</div>
  </div>

  <!-- 物质库存 -->
  <aside class="rpanel">
    <div class="rp-head">🧪 物质库存</div>
    <div class="rp-body" id="invList"><div class="empty">击杀僵尸收集物质…</div></div>
    <div class="rp-foot"><button class="lab-btn" id="btnLab">🔬 炼金实验室</button></div>
  </aside>
</div>

<!-- 弹窗 -->
<div class="modal" id="labMod"><div class="modal-box wide"><h3>🔬 炼金实验室</h3><div id="labC"></div><button class="modal-close" id="closeLab">关闭实验室</button></div></div>
<div class="modal" id="rankMod"><div class="modal-box"><h3>🏆 全服排行榜</h3><div id="rankC"></div><button class="modal-close" id="closeRk">关闭</button></div></div>
<div class="modal" id="guideMod"><div class="modal-box wide"><h3>📖 图鉴</h3><div id="guideC"></div><button class="modal-close" id="closeGd">关闭</button></div></div>

<script src="app.js"></script>
</body>
</html>
